[project]
name = "backend"
version = "0.3.0"
description = "Hybrid search RAG backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "fonttools>=4.65.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.11.0",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.20",
    "qdrant-client>=1.15.0",
    "ragas>=0.4.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.0.1",
    "streamlit>=1.64.0",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: isolated unit tests",
    "integration: API and store integration tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
